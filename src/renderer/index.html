<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Master Tool</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="../../build/icon.png" alt="">
        <div>
          <div class="brand-name">Master Tool</div>
          <div class="brand-sub" id="stats"></div>
        </div>
      </div>
      <span class="grow"></span>
      <div class="actions">
        <button class="btn ghost" id="btnRefresh"></button>
        <button class="btn ghost" id="btnSettings"></button>
        <button class="account-chip" id="btnAccount"><span class="ac-avatar"></span><span class="ac-name"></span></button>
      </div>
    </header>

    <div class="update-bar hidden" id="updateBar"></div>
    <div class="offline-bar hidden" id="offlineBar"></div>

    <main class="content" id="content">
      <section class="group">
        <div class="section-title"><span id="tInstalled"></span><span class="count" id="cInstalled"></span><span class="hint" id="hInstalled"></span></div>
        <div class="tiles" id="installed"></div>
      </section>
      <section class="group">
        <div class="section-title"><span id="tAvailable"></span><span class="count" id="cAvailable"></span><span class="hint" id="hAvailable"></span></div>
        <div class="tiles" id="available"></div>
      </section>
    </main>
  </div>

  <script src="../i18n.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
