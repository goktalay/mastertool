# Daha önce yayınlanmış bir GitHub Release'in exe'lerini mastertool.download'a yükler (var olanlar 409 ile atlanır).
# Actions › "mastertool.download'a yükle" › Run workflow › etiket (ör. v1.0.0).
name: mastertool.download'a yükle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v1.0.0)'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiket açıklaması (sürüm notu) için

      - name: Release'teki exe'leri indir
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release download "$TAG" -p 'Master-Tool-Setup-*.exe' -p 'Master-Tool-Portable-*.exe' -D dist; then
            echo "Release '$TAG' bulunamadı; etiketin başarılı Release iş akışı artifact'i deneniyor."
            RUN_ID=$(gh run list --workflow release.yml --branch "$TAG" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ]; then
              echo "::error::'$TAG' için ne Release ne de başarılı bir derleme (Release iş akışı) bulundu. Önce etiketi gönderip derlemenin bitmesini bekleyin."
              exit 1
            fi
            gh run download "$RUN_ID" -n Master-Tool-windows -D dist
          fi

      - name: mastertool.download'a yükle
        env:
          MASTERTOOL_RELEASE_KEY: ${{ secrets.MASTERTOOL_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          bash scripts/upload-mastertool.sh "$V" "dist/Master-Tool-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")" "dist/Master-Tool-Portable-$V.exe"
